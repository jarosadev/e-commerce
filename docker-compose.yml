name: ecommerce-saas-infra

services:
  postgres:
    image: postgres:17
    container_name: ecommerce_saas_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ecommerce_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ecommerce_secret_2026}
      POSTGRES_DB: ${POSTGRES_DB:-ecommerce_saas}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ecommerce_admin} -d ${POSTGRES_DB:-ecommerce_saas}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: ecommerce_saas_redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  s3:
    image: chrislusf/seaweedfs:latest
    container_name: ecommerce_saas_s3
    restart: unless-stopped
    command: "server -s3 -s3.port=9000 -master.port=9333 -volume.port=8080 -filer=true -dir=/data"
    ports:
      - "${S3_API_PORT:-9000}:9000"
      - "${S3_UI_PORT:-8888}:8888"
    volumes:
      - s3_data:/data

  mailpit:
    image: axllent/mailpit:latest
    container_name: ecommerce_saas_mailpit
    restart: unless-stopped
    ports:
      - "${SMTP_PORT:-1025}:1025"
      - "${MAILPIT_UI_PORT:-8025}:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
  redis_data:
  s3_data:
